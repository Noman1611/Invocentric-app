<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen 01: Login & Authentication -->
  <rect width="390" height="844" rx="40" fill="#F8FAFC"/>
  
  <!-- Status Bar -->
  <g id="StatusBar" transform="translate(24, 14)">
    <text x="0" y="14" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0F172A">9:41</text>
    <rect x="135" y="-2" width="102" height="22" rx="11" fill="#0F172A"/>
    <path d="M335 12 h3 v-6 h-3 v6 z M340 12 h3 v-8 h-3 v8 z M345 12 h3 v-10 h-3 v10 z" fill="#0F172A"/>
    <rect x="354" y="2" width="18" height="10" rx="3" fill="none" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="356" y="4" width="10" height="6" rx="1.5" fill="#0F172A"/>
  </g>

  <!-- Brand Logo & Header -->
  <g id="Header" transform="translate(24, 70)">
    <circle cx="28" cy="28" r="28" fill="#10B981"/>
    <path d="M18 28 l7 7 l14 -14" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="26" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#0F172A">InvoCentric</text>
    <text x="68" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748B">Simple • Secure • Fast GST Billing</text>
  </g>

  <!-- Login Card Form -->
  <g id="FormCard" transform="translate(24, 150)">
    <rect width="342" height="490" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <text x="24" y="40" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#0F172A">Welcome Back 👋</text>
    <text x="24" y="60" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B">Sign in to manage your bills and stock</text>

    <!-- Google Sign-In Button -->
    <rect x="24" y="80" width="294" height="48" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="48" cy="104" r="10" fill="#EA4335"/>
    <text x="48" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">G</text>
    <text x="175" y="109" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Sign in with Google</text>

    <!-- Divider -->
    <line x1="24" y1="150" x2="135" y2="150" stroke="#E2E8F0"/>
    <text x="171" y="154" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">OR EMAIL</text>
    <line x1="207" y1="150" x2="318" y2="150" stroke="#E2E8F0"/>

    <!-- Email Input -->
    <text x="24" y="180" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#334155">Email Address</text>
    <rect x="24" y="190" width="294" height="48" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="40" y="220" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#0F172A">partner@store.com</text>

    <!-- Password Input -->
    <text x="24" y="260" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#334155">Password</text>
    <rect x="24" y="270" width="294" height="48" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="40" y="300" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0F172A">••••••••••••</text>
    <text x="290" y="300" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#10B981">SHOW</text>

    <!-- Forgot Password link -->
    <text x="318" y="338" text-anchor="end" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#10B981">Forgot Password?</text>

    <!-- Sign In CTA Button -->
    <rect x="24" y="360" width="294" height="50" rx="14" fill="#059669"/>
    <text x="171" y="391" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Sign In ➔</text>

    <!-- Switch to Signup -->
    <text x="171" y="440" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#64748B">Don't have an account? <tspan fill="#059669" font-weight="800">Create Free</tspan></text>
  </g>

  <!-- Offline Local PC Notice -->
  <g transform="translate(24, 660)">
    <rect width="342" height="54" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
    <circle cx="28" cy="27" r="10" fill="#10B981"/>
    <path d="M23 27 l3 3 l7 -7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#065F46">Offline-First Technology Active</text>
    <text x="48" y="38" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#047857">Works 100% without internet. Local encrypted storage.</text>
  </g>

  <!-- Footer Terms -->
  <text x="195" y="770" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">InvoCentric v1.0 • Terms of Service & Privacy</text>
</svg>
