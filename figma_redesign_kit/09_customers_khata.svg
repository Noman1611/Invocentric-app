<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen 09: Customers & Khata Ledger -->
  <rect width="390" height="844" rx="40" fill="#F8FAFC"/>

  <!-- Top App Bar -->
  <g id="TopBar" transform="translate(20, 24)">
    <text x="0" y="24" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#0F172A">Customers (Khata)</text>
    <rect x="230" y="2" width="120" height="34" rx="10" fill="#059669"/>
    <text x="290" y="23" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">+ Add Customer</text>
  </g>

  <!-- Khata Receivables Summary Banner -->
  <g id="KhataBanner" transform="translate(20, 74)">
    <rect width="350" height="82" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748B">TOTAL MARKET RECEIVABLES (LE NA HAI)</text>
    <text x="16" y="56" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#E11D48">₹18,400.00</text>
    <rect x="238" y="24" width="96" height="32" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="286" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#065F46">💬 Remind All</text>
  </g>

  <!-- Search Customer Input -->
  <g id="SearchBar" transform="translate(20, 168)">
    <rect width="350" height="42" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="22" cy="21" r="5.5" stroke="#64748B" stroke-width="2" fill="none"/>
    <line x1="26" y1="25" x2="31" y2="30" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8">Search customer by name or phone...</text>
  </g>

  <!-- Customer Cards List -->
  <g id="CustomersList" transform="translate(20, 222)">
    <!-- Customer 1 -->
    <g transform="translate(0, 0)">
      <rect width="350" height="86" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="28" cy="28" r="16" fill="#059669"/>
      <text x="28" y="33" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">AT</text>

      <text x="54" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Aarav Traders</text>
      <text x="54" y="44" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B">+91 98765 43210 • 14 Invoices</text>

      <!-- Right Balance Status -->
      <text x="334" y="26" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#059669">₹0.00</text>
      <rect x="274" y="34" width="60" height="20" rx="5" fill="#DEF7EC"/>
      <text x="304" y="47" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="800" fill="#03543F">ALL CLEAR</text>

      <!-- WhatsApp reminder shortcut -->
      <line x1="16" y1="62" x2="334" y2="62" stroke="#F1F5F9"/>
      <text x="16" y="76" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#0284C7">View Full Ledger Statement ➔</text>
    </g>

    <!-- Customer 2 (Pending Khata) -->
    <g transform="translate(0, 98)">
      <rect width="350" height="86" rx="16" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="16" fill="#D97706"/>
      <text x="28" y="33" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">MS</text>

      <text x="54" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Meera General Store</text>
      <text x="54" y="44" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B">+91 91234 56789 • 8 Invoices</text>

      <text x="334" y="26" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#E11D48">₹3,200.00</text>
      <rect x="264" y="34" width="70" height="20" rx="5" fill="#FEE2E2"/>
      <text x="299" y="47" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="900" fill="#E11D48">DUE (LE NA)</text>

      <line x1="16" y1="62" x2="334" y2="62" stroke="#F1F5F9"/>
      <text x="16" y="76" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#16A34A">💬 Send Payment Reminder on WhatsApp</text>
    </g>

    <!-- Customer 3 (Overdue Khata) -->
    <g transform="translate(0, 196)">
      <rect width="350" height="86" rx="16" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="16" fill="#E11D48"/>
      <text x="28" y="33" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">RK</text>

      <text x="54" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">RK Enterprises</text>
      <text x="54" y="44" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B">+91 99887 76655 • 22 Invoices</text>

      <text x="334" y="26" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#E11D48">₹12,930.00</text>
      <rect x="254" y="34" width="80" height="20" rx="5" fill="#FEE2E2"/>
      <text x="294" y="47" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="900" fill="#E11D48">OVERDUE 5d</text>

      <line x1="16" y1="62" x2="334" y2="62" stroke="#F1F5F9"/>
      <text x="16" y="76" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#16A34A">💬 Send Reminder</text>
      <text x="220" y="76" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#059669">+ Record Payment</text>
    </g>

    <!-- Customer 4 -->
    <g transform="translate(0, 294)">
      <rect width="350" height="86" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="28" cy="28" r="16" fill="#0284C7"/>
      <text x="28" y="33" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">NE</text>

      <text x="54" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">National Electronics</text>
      <text x="54" y="44" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#64748B">+91 94567 89012 • 4 Invoices</text>

      <text x="334" y="26" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#E11D48">₹2,270.00</text>
      <rect x="264" y="34" width="70" height="20" rx="5" fill="#FEF3C7"/>
      <text x="299" y="47" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="900" fill="#B45309">DUE (LE NA)</text>

      <line x1="16" y1="62" x2="334" y2="62" stroke="#F1F5F9"/>
      <text x="16" y="76" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#0284C7">View Full Ledger Statement ➔</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g id="BottomNav" transform="translate(0, 760)">
    <rect width="390" height="84" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="39" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748B">Home</text>
    <text x="117" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748B">Invoices</text>
    <circle cx="195" cy="24" r="22" fill="#059669"/>
    <text x="195" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">+</text>
    <text x="273" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748B">Stock</text>
    <text x="351" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#059669">Customers</text>
  </g>
</svg>
