<svg width="390" height="960" viewBox="0 0 390 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen 03: Create Invoice Form -->
  <rect width="390" height="960" rx="40" fill="#F8FAFC"/>

  <!-- Top App Bar -->
  <g id="TopBar" transform="translate(20, 20)">
    <!-- Back Button -->
    <rect x="0" y="20" width="38" height="38" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M22 34 l-5 5 l5 5" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="50" y="44" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#0F172A">Create New Invoice</text>
    <rect x="260" y="24" width="90" height="30" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="305" y="43" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#065F46">TAX INVOICE</text>
  </g>

  <!-- Invoice Meta Details (Number, Date) -->
  <g id="InvoiceMeta" transform="translate(20, 90)">
    <rect width="350" height="76" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <!-- Inv No -->
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">Invoice Number</text>
    <text x="16" y="52" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#0F172A">INV-2026-0045</text>
    <!-- Divider -->
    <line x1="175" y1="14" x2="175" y2="62" stroke="#F1F5F9" stroke-width="1.5"/>
    <!-- Inv Date -->
    <text x="190" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">Invoice Date</text>
    <text x="190" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">24 Oct 2026 📅</text>
  </g>

  <!-- Customer Selection Card -->
  <g id="CustomerSection" transform="translate(20, 180)">
    <rect width="350" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="16" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748B">BILL TO CUSTOMER</text>
    <text x="280" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#059669">+ New Customer</text>

    <!-- Selected Customer Box -->
    <rect x="16" y="34" width="318" height="46" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="36" cy="57" r="12" fill="#059669"/>
    <text x="36" y="61" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">AT</text>
    <text x="56" y="52" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Aarav Traders (Mumbai)</text>
    <text x="56" y="68" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">+91 98765 43210 • GSTIN: 27AABCT3518Q1Z1</text>
  </g>

  <!-- Line Items Section -->
  <g id="ItemsSection" transform="translate(20, 288)">
    <div style="display: flex;">
      <text x="0" y="16" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Items List (2 Items Added)</text>
      <text x="260" y="16" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#059669">+ Scan Barcode</text>
    </div>

    <!-- Item Card 1 -->
    <g transform="translate(0, 26)">
      <rect width="350" height="88" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="16" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Basmati Premium Rice 5kg</text>
      <text x="16" y="40" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">HSN: 1006 • GST 5%</text>
      
      <!-- Stepper and Price -->
      <rect x="16" y="50" width="80" height="26" rx="6" fill="#F1F5F9"/>
      <text x="24" y="67" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#64748B">−</text>
      <text x="52" y="67" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#0F172A">2 Pcs</text>
      <text x="82" y="67" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#059669">+</text>

      <text x="110" y="67" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">@ ₹450.00</text>
      <text x="334" y="67" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#0F172A">₹945.00</text>
    </g>

    <!-- Item Card 2 -->
    <g transform="translate(0, 124)">
      <rect width="350" height="88" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="16" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Tata Tea Gold 500g</text>
      <text x="16" y="40" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">HSN: 0902 • GST 12%</text>

      <rect x="16" y="50" width="80" height="26" rx="6" fill="#F1F5F9"/>
      <text x="24" y="67" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#64748B">−</text>
      <text x="52" y="67" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#0F172A">1 Pcs</text>
      <text x="82" y="67" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#059669">+</text>

      <text x="110" y="67" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">@ ₹310.00</text>
      <text x="334" y="67" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#0F172A">₹347.20</text>
    </g>

    <!-- Add Item Row Button -->
    <rect x="0" y="222" width="350" height="42" rx="12" fill="#FFFFFF" stroke="#059669" stroke-dasharray="4 4"/>
    <text x="175" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#059669">+ Add Another Item</text>
  </g>

  <!-- Tax Breakdown & Calculation Summary -->
  <g id="CalculationSummary" transform="translate(20, 574)">
    <rect width="350" height="180" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    
    <text x="16" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">Taxable Amount</text>
    <text x="334" y="28" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#0F172A">₹1,210.00</text>

    <text x="16" y="52" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">CGST (Intra-state)</text>
    <text x="334" y="52" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#0F172A">₹41.10</text>

    <text x="16" y="76" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">SGST (Intra-state)</text>
    <text x="334" y="76" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#0F172A">₹41.10</text>

    <text x="16" y="100" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#059669">Discount Applied (Flat)</text>
    <text x="334" y="100" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#059669">-₹50.00</text>

    <text x="16" y="124" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">Round Off</text>
    <text x="334" y="124" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#64748B">-₹0.20</text>

    <line x1="16" y1="138" x2="334" y2="138" stroke="#E2E8F0"/>

    <text x="16" y="162" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#0F172A">Grand Total (Net)</text>
    <text x="334" y="164" text-anchor="end" font-family="Inter, sans-serif" font-size="19" font-weight="900" fill="#059669">₹1,242.00</text>
  </g>

  <!-- Sticky Bottom Checkout Action Bar -->
  <g id="BottomActionBar" transform="translate(0, 856)">
    <rect width="390" height="104" fill="#FFFFFF" stroke="#E2E8F0"/>
    
    <!-- Save Draft Button -->
    <rect x="20" y="16" width="100" height="50" rx="14" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="70" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#475569">Save Draft</text>

    <!-- Save & Print / Share CTA -->
    <rect x="130" y="16" width="240" height="50" rx="14" fill="#059669"/>
    <text x="250" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">Save &amp; Print Invoice ➔</text>
  </g>
</svg>
