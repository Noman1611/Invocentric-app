<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen 08: Items & Inventory -->
  <rect width="390" height="844" rx="40" fill="#F8FAFC"/>

  <!-- Top App Bar -->
  <g id="TopBar" transform="translate(20, 24)">
    <text x="0" y="24" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#0F172A">Items &amp; Inventory</text>
    <rect x="238" y="2" width="112" height="34" rx="10" fill="#059669"/>
    <text x="294" y="23" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">+ Add Product</text>
  </g>

  <!-- KPI Stock Overview Chips -->
  <g id="StockStats" transform="translate(20, 72)">
    <!-- Total Items -->
    <rect x="0" y="0" width="110" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="14" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#64748B">TOTAL ITEMS</text>
    <text x="14" y="48" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#0F172A">84 SKUs</text>

    <!-- Total Stock Value -->
    <rect x="120" y="0" width="110" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="14" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#64748B">STOCK VALUE</text>
    <text x="134" y="48" font-family="Inter, sans-serif" font-size="16" font-weight="900" fill="#059669">₹2.45 Lakh</text>

    <!-- Low Stock Alert -->
    <rect x="240" y="0" width="110" height="64" rx="14" fill="#FEF3C7" stroke="#FDE68A"/>
    <text x="254" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#B45309">LOW STOCK</text>
    <text x="254" y="48" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#B45309">4 Items ⚠️</text>
  </g>

  <!-- Search Bar -->
  <g id="SearchBar" transform="translate(20, 150)">
    <rect width="350" height="42" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="22" cy="21" r="5.5" stroke="#64748B" stroke-width="2" fill="none"/>
    <line x1="26" y1="25" x2="31" y2="30" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8">Search by Item Name, Barcode, HSN...</text>
  </g>

  <!-- Inventory Items List -->
  <g id="ItemsList" transform="translate(20, 206)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect width="350" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#ECFDF5"/>
      <text x="32" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="16">🍚</text>
      
      <text x="58" y="28" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#0F172A">Basmati Premium Rice 5kg</text>
      <text x="58" y="44" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">HSN: 1006 • Buy: ₹380 • GST 5%</text>

      <text x="58" y="72" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#059669">Sell: ₹450.00</text>
      
      <!-- In Stock Badge -->
      <rect x="250" y="52" width="86" height="24" rx="6" fill="#DEF7EC"/>
      <text x="293" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#03543F">In Stock: 42</text>
    </g>

    <!-- Item 2 (Low Stock Warning) -->
    <g transform="translate(0, 104)">
      <rect width="350" height="92" rx="16" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#FEE2E2"/>
      <text x="32" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="16">🍫</text>

      <text x="58" y="28" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#0F172A">Dairy Milk Silk 150g</text>
      <text x="58" y="44" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">HSN: 1806 • Buy: ₹65 • GST 18%</text>

      <text x="58" y="72" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#059669">Sell: ₹80.00</text>

      <!-- Low Stock Badge with Restock trigger -->
      <rect x="240" y="52" width="96" height="24" rx="6" fill="#FEE2E2"/>
      <text x="288" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="900" fill="#E11D48">⚠️ Low: 4 left</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 208)">
      <rect width="350" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#F0FDFA"/>
      <text x="32" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="16">☕</text>

      <text x="58" y="28" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#0F172A">Tata Tea Gold 500g</text>
      <text x="58" y="44" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">HSN: 0902 • Buy: ₹250 • GST 12%</text>

      <text x="58" y="72" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#059669">Sell: ₹310.00</text>

      <rect x="250" y="52" width="86" height="24" rx="6" fill="#DEF7EC"/>
      <text x="293" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#03543F">In Stock: 18</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(0, 312)">
      <rect width="350" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#F3E8FF"/>
      <text x="32" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="16">🧴</text>

      <text x="58" y="28" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#0F172A">Surf Excel Easy Wash 1kg</text>
      <text x="58" y="44" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">HSN: 3402 • Buy: ₹110 • GST 18%</text>

      <text x="58" y="72" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#059669">Sell: ₹140.00</text>

      <rect x="250" y="52" width="86" height="24" rx="6" fill="#DEF7EC"/>
      <text x="293" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#03543F">In Stock: 22</text>
    </g>

    <!-- Item 5 -->
    <g transform="translate(0, 416)">
      <rect width="350" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#EFF6FF"/>
      <text x="32" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="16">🧼</text>

      <text x="58" y="28" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#0F172A">Dettol Original Soap 125g</text>
      <text x="58" y="44" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">HSN: 3401 • Buy: ₹42 • GST 18%</text>

      <text x="58" y="72" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#059669">Sell: ₹55.00</text>

      <rect x="250" y="52" width="86" height="24" rx="6" fill="#DEF7EC"/>
      <text x="293" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#03543F">In Stock: 52</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g id="BottomNav" transform="translate(0, 760)">
    <rect width="390" height="84" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="39" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748B">Home</text>
    <text x="117" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748B">Invoices</text>
    <circle cx="195" cy="24" r="22" fill="#059669"/>
    <text x="195" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">+</text>
    <text x="273" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#059669">Stock</text>
    <text x="351" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748B">More</text>
  </g>
</svg>
