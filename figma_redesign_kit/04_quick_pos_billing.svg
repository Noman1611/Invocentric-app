<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen 04: Quick POS Billing -->
  <rect width="390" height="844" rx="40" fill="#F8FAFC"/>

  <!-- Top Bar with Barcode Scanner & Camera trigger -->
  <g id="TopBar" transform="translate(20, 24)">
    <text x="0" y="24" font-family="Inter, sans-serif" font-size="19" font-weight="900" fill="#0F172A">Quick POS Billing</text>
    <rect x="290" y="4" width="60" height="30" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="320" y="23" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#065F46">COUNTER 1</text>
  </g>

  <!-- Barcode Search Input & Camera Scanner Button -->
  <g id="SearchHeader" transform="translate(20, 72)">
    <rect width="288" height="46" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <!-- Search / Barcode Icon -->
    <path d="M16 16 h4 v-4 h-4 v4 z M24 12 h4 v4 h-4 v-4 z M16 20 h4 v4 h-4 v-4 z M24 20 h4 v4 h-4 v-4 z" fill="#059669"/>
    <text x="38" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Scan Barcode or Type Item Name...</text>

    <!-- Live Camera Scanner Icon Button -->
    <rect x="298" y="0" width="52" height="46" rx="12" fill="#059669"/>
    <circle cx="324" cy="23" r="7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M319 13 h10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Category Filter Pills -->
  <g id="Categories" transform="translate(20, 132)">
    <!-- All (Active) -->
    <rect x="0" y="0" width="56" height="32" rx="10" fill="#059669"/>
    <text x="28" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">All</text>

    <!-- Groceries -->
    <rect x="64" y="0" width="80" height="32" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="104" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Groceries</text>

    <!-- Beverages -->
    <rect x="152" y="0" width="86" height="32" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="195" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Beverages</text>

    <!-- Snacks -->
    <rect x="246" y="0" width="70" height="32" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="281" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Snacks</text>
  </g>

  <!-- POS Product Touch Grid (2x3 Grid) -->
  <g id="ProductGrid" transform="translate(20, 180)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#ECFDF5"/>
      <text x="30" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="16">🍚</text>
      <text x="56" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#059669">Stock: 42</text>
      <text x="12" y="72" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#0F172A">Basmati Rice 5kg</text>
      <text x="12" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#059669">₹450.00</text>
      <circle cx="148" cy="94" r="14" fill="#059669"/>
      <text x="148" y="99" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">+</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(180, 0)">
      <rect width="170" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#F0FDFA"/>
      <text x="30" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="16">☕</text>
      <text x="56" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0D9488">Stock: 18</text>
      <text x="12" y="72" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#0F172A">Tata Tea Gold</text>
      <text x="12" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#059669">₹310.00</text>
      <circle cx="148" cy="94" r="14" fill="#059669"/>
      <text x="148" y="99" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">+</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 130)">
      <rect width="170" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#FEF3C7"/>
      <text x="30" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="16">🍪</text>
      <text x="56" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#D97706">Stock: 64</text>
      <text x="12" y="72" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#0F172A">Good Day Butter</text>
      <text x="12" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#059669">₹30.00</text>
      <circle cx="148" cy="94" r="14" fill="#059669"/>
      <text x="148" y="99" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">+</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(180, 130)">
      <rect width="170" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#FEE2E2"/>
      <text x="30" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="16">🍫</text>
      <text x="56" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#E11D48">Stock: 4 Low</text>
      <text x="12" y="72" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#0F172A">Dairy Milk Silk</text>
      <text x="12" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#059669">₹80.00</text>
      <circle cx="148" cy="94" r="14" fill="#059669"/>
      <text x="148" y="99" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">+</text>
    </g>

    <!-- Item 5 -->
    <g transform="translate(0, 260)">
      <rect width="170" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#EFF6FF"/>
      <text x="30" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="16">🧼</text>
      <text x="56" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#2563EB">Stock: 52</text>
      <text x="12" y="72" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#0F172A">Dettol Soap 125g</text>
      <text x="12" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#059669">₹55.00</text>
      <circle cx="148" cy="94" r="14" fill="#059669"/>
      <text x="148" y="99" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">+</text>
    </g>

    <!-- Item 6 -->
    <g transform="translate(180, 260)">
      <rect width="170" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#F3E8FF"/>
      <text x="30" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="16">🧴</text>
      <text x="56" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#7C3AED">Stock: 22</text>
      <text x="12" y="72" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#0F172A">Surf Excel 1kg</text>
      <text x="12" y="100" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#059669">₹140.00</text>
      <circle cx="148" cy="94" r="14" fill="#059669"/>
      <text x="148" y="99" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">+</text>
    </g>
  </g>

  <!-- Sticky POS Cart Drawer Bottom Sheet -->
  <g id="PosCartDrawer" transform="translate(0, 680)">
    <rect width="390" height="164" rx="28" fill="#0F172A"/>
    
    <!-- Grab bar -->
    <rect x="175" y="10" width="40" height="4" rx="2" fill="#334155"/>

    <!-- Cart Summary Row -->
    <g transform="translate(24, 26)">
      <text x="0" y="20" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">3 Items in Cart</text>
      <text x="0" y="44" font-family="Inter, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">₹840.00</text>
      
      <!-- Payment Mode Selector Pills -->
      <g transform="translate(160, 10)">
        <rect x="0" y="0" width="54" height="28" rx="8" fill="#10B981"/>
        <text x="27" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Cash</text>

        <rect x="60" y="0" width="54" height="28" rx="8" fill="#1E293B" stroke="#334155"/>
        <text x="87" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">UPI</text>

        <rect x="120" y="0" width="54" height="28" rx="8" fill="#1E293B" stroke="#334155"/>
        <text x="147" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">Card</text>
      </g>
    </g>

    <!-- Large One-Tap Pay & Thermal Print Button -->
    <g transform="translate(24, 88)">
      <rect width="342" height="52" rx="16" fill="#10B981"/>
      <text x="171" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#022C22">Pay &amp; Thermal Print (F12) ➔</text>
    </g>
  </g>
</svg>
