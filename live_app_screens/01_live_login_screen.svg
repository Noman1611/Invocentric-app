<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen 01: Live Login Screen (Exact Desktop & Tablet Layout) -->
  <rect width="1200" height="720" fill="#F8FAFC"/>
  
  <!-- Subtle Grid Background Pattern -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="url(#grid)" opacity="0.6"/>

  <!-- ================= LEFT HERO OFFER ================= -->
  <g id="HeroOffer" transform="translate(100, 110)">
    <!-- Logo -->
    <circle cx="22" cy="22" r="22" fill="#0D3B31"/>
    <path d="M14 22 l5 5 l11 -11" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="29" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#0D3B31">InvoCentric</text>

    <!-- Main Headline -->
    <text x="0" y="110" font-family="Inter, sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="-1">You're <tspan fill="#0D3B31">2 clicks</tspan> away from</text>
    <text x="0" y="162" font-family="Inter, sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="-1">smarter GST billing &amp;</text>
    <text x="0" y="214" font-family="Inter, sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="-1">effortless growth.</text>

    <!-- Subtitle -->
    <text x="0" y="270" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#475569">Free up business hours while increasing daily profit,</text>
    <text x="0" y="294" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#475569">cashflow &amp; 100% tax compliance.</text>

    <!-- Action Badges / Pills -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="204" height="44" rx="12" fill="#0D3B31"/>
      <text x="102" y="27" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">1-Month free trial Claim</text>

      <rect x="216" y="0" width="186" height="44" rx="12" fill="#FFFFFF" stroke="#0D3B31"/>
      <text x="309" y="27" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#0D3B31">No credit card needed</text>
    </g>
  </g>

  <!-- ================= RIGHT LOGIN CARD ================= -->
  <g id="LoginCard" transform="translate(680, 75)">
    <rect width="420" height="570" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0px 20px 30px rgba(0,0,0,0.04))"/>
    
    <!-- Card Logo -->
    <circle cx="210" cy="54" r="24" fill="#0D3B31"/>
    <path d="M201 54 l6 6 l12 -12" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="210" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="900" fill="#0F172A">Login</text>
    <text x="210" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#64748B">Enter your details to login.</text>

    <!-- Email Field -->
    <g transform="translate(36, 156)">
      <text x="0" y="14" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#334155">Email</text>
      <rect x="0" y="22" width="348" height="46" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="14" y="51" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#64748B">Enter your Email</text>
    </g>

    <!-- Password Field -->
    <g transform="translate(36, 240)">
      <text x="0" y="14" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#334155">Password</text>
      <text x="348" y="14" text-anchor="end" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#059669">Forgot?</text>
      <rect x="0" y="22" width="348" height="46" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="14" y="51" font-family="Inter, sans-serif" font-size="13.5" font-weight="500" fill="#64748B">Enter your password</text>
      <!-- Eye Icon -->
      <path d="M320 51 c-4 -5 -10 -8 -15 -8 s-11 3 -15 8 c4 5 10 8 15 8 s11 -3 15 -8 z" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
      <circle cx="305" cy="51" r="2.5" fill="#94A3B8"/>
    </g>

    <!-- Login Button -->
    <rect x="36" y="330" width="348" height="48" rx="12" fill="#111827"/>
    <text x="210" y="360" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF">Login</text>

    <!-- OR Divider -->
    <line x1="36" y1="406" x2="185" y2="406" stroke="#E2E8F0"/>
    <text x="210" y="410" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">OR</text>
    <line x1="235" y1="406" x2="384" y2="406" stroke="#E2E8F0"/>

    <!-- Google Button -->
    <rect x="36" y="428" width="348" height="46" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="210" y="457" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#334155">G  Continue with Google</text>

    <!-- Sign up text -->
    <text x="210" y="504" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#64748B">Don't have an account? <tspan fill="#059669" font-weight="800">Sign up</tspan></text>

    <!-- Terms -->
    <text x="210" y="538" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8">By proceeding, you agree to InvoCentric's <tspan font-weight="700" fill="#475569">Terms of Service</tspan> and <tspan font-weight="700" fill="#475569">Privacy Policy</tspan>.</text>
  </g>

  <!-- Bottom Floating Help Pill -->
  <g id="HelpBadge" transform="translate(1060, 660)">
    <rect width="110" height="36" rx="18" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.06))"/>
    <circle cx="18" cy="18" r="8" fill="#ECFDF5"/>
    <text x="18" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="900" fill="#059669">?</text>
    <text x="34" y="23" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Need Help?</text>
  </g>
</svg>
