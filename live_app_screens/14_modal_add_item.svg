<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modal 14: Add Product / Item Modal (Opened on "+ Add Product" button click) -->
  <rect width="390" height="844" rx="40" fill="#0F172A" fill-opacity="0.6"/>

  <g id="AddProductModal" transform="translate(0, 140)">
    <rect width="390" height="704" rx="28" fill="#FFFFFF"/>
    <rect x="175" y="10" width="40" height="4" rx="2" fill="#CBD5E1"/>

    <!-- Header -->
    <g transform="translate(24, 28)">
      <text x="0" y="20" font-family="Inter, sans-serif" font-size="19" font-weight="900" fill="#0F172A">Add New Product</text>
      <text x="0" y="38" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748B">Add item details, pricing &amp; barcode for fast billing</text>

      <circle cx="330" cy="18" r="14" fill="#F1F5F9"/>
      <path d="M325 13 L335 23 M335 13 L325 23" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g transform="translate(24, 88)">
      <!-- Item Name -->
      <text x="0" y="14" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Product / Item Name *</text>
      <rect x="0" y="22" width="342" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="14" y="49" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Basmati Premium Rice 5kg</text>

      <!-- Barcode / SKU -->
      <g transform="translate(0, 78)">
        <text x="0" y="14" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Barcode / SKU Code</text>
        <rect x="0" y="22" width="342" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="14" y="49" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">8901234567890</text>
        <rect x="250" y="28" width="80" height="32" rx="6" fill="#ECFDF5"/>
        <text x="290" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#059669">📷 Scan Code</text>
      </g>

      <!-- Selling Price & Purchase Price (2 Columns) -->
      <g transform="translate(0, 156)">
        <text x="0" y="14" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Selling Price (₹) *</text>
        <rect x="0" y="22" width="164" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="14" y="49" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#059669">₹450.00</text>

        <text x="178" y="14" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Purchase Price (₹)</text>
        <rect x="178" y="22" width="164" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="192" y="49" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">₹380.00</text>
      </g>

      <!-- GST Rate & HSN Code (2 Columns) -->
      <g transform="translate(0, 234)">
        <text x="0" y="14" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#334155">GST Tax Rate</text>
        <rect x="0" y="22" width="164" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="14" y="49" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A">5% GST</text>

        <text x="178" y="14" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#334155">HSN / SAC Code</text>
        <rect x="178" y="22" width="164" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="192" y="49" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A">1006</text>
      </g>

      <!-- Opening Stock & Low Stock Alert -->
      <g transform="translate(0, 312)">
        <text x="0" y="14" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Opening Stock Quantity</text>
        <rect x="0" y="22" width="164" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="14" y="49" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F172A">42 Pcs</text>

        <text x="178" y="14" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Low Stock Alert Level</text>
        <rect x="178" y="22" width="164" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="192" y="49" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#D97706">5 Pcs</text>
      </g>

      <!-- Buttons -->
      <g transform="translate(0, 420)">
        <rect x="0" y="0" width="160" height="48" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="80" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#475569">Cancel</text>

        <rect x="172" y="0" width="170" height="48" rx="12" fill="#059669"/>
        <text x="257" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">Save Product ➔</text>
      </g>
    </g>
  </g>
</svg>
