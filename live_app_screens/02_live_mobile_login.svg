<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen 02: Live Mobile Login (Smartphone View) -->
  <rect width="390" height="844" rx="40" fill="#F8FAFC"/>

  <!-- Status Bar -->
  <g id="StatusBar" transform="translate(24, 14)">
    <text x="0" y="14" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0F172A">9:41</text>
    <rect x="135" y="-2" width="102" height="22" rx="11" fill="#0F172A"/>
    <path d="M335 12 h3 v-6 h-3 v6 z M340 12 h3 v-8 h-3 v8 z M345 12 h3 v-10 h-3 v10 z" fill="#0F172A"/>
    <rect x="354" y="2" width="18" height="10" rx="3" fill="none" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="356" y="4" width="10" height="6" rx="1.5" fill="#0F172A"/>
  </g>

  <!-- Mobile Brand Header -->
  <g id="BrandHeader" transform="translate(20, 64)">
    <circle cx="20" cy="20" r="20" fill="#0D3B31"/>
    <path d="M13 20 l4 4 l10 -10" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="26" font-family="Inter, sans-serif" font-size="24" font-weight="900" fill="#0D3B31">InvoCentric</text>

    <!-- Mini Offer Badges -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="170" height="30" rx="8" fill="#0D3B31"/>
      <text x="85" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">1-Month free trial Claim</text>

      <rect x="178" y="0" width="150" height="30" rx="8" fill="#FFFFFF" stroke="#0D3B31"/>
      <text x="253" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#0D3B31">No credit card needed</text>
    </g>
  </g>

  <!-- Mobile Auth Card -->
  <g id="AuthCard" transform="translate(20, 168)">
    <rect width="350" height="580" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0px 10px 25px rgba(0,0,0,0.05))"/>

    <circle cx="175" cy="46" r="22" fill="#0D3B31"/>
    <path d="M167 46 l5 5 l10 -10" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="175" y="96" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#0F172A">Login</text>
    <text x="175" y="116" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="500" fill="#64748B">Enter your details to login.</text>

    <!-- Email Field -->
    <g transform="translate(24, 138)">
      <text x="0" y="14" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Email</text>
      <rect x="0" y="22" width="302" height="46" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="14" y="50" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B">Enter your Email</text>
    </g>

    <!-- Password Field -->
    <g transform="translate(24, 218)">
      <text x="0" y="14" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Password</text>
      <text x="302" y="14" text-anchor="end" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#059669">Forgot?</text>
      <rect x="0" y="22" width="302" height="46" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="14" y="50" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#64748B">Enter your password</text>
      <path d="M280 50 c-3 -4 -7 -6 -11 -6 s-8 2 -11 6 c3 4 7 6 11 6 s8 -2 11 -6 z" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
      <circle cx="269" cy="50" r="2" fill="#94A3B8"/>
    </g>

    <!-- Login Button -->
    <rect x="24" y="306" width="302" height="48" rx="12" fill="#111827"/>
    <text x="175" y="336" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF">Login</text>

    <!-- OR Divider -->
    <line x1="24" y1="380" x2="155" y2="380" stroke="#E2E8F0"/>
    <text x="175" y="384" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">OR</text>
    <line x1="195" y1="380" x2="326" y2="380" stroke="#E2E8F0"/>

    <!-- Google Button -->
    <rect x="24" y="402" width="302" height="46" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="175" y="430" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#334155">G  Continue with Google</text>

    <!-- Sign up text -->
    <text x="175" y="478" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748B">Don't have an account? <tspan fill="#059669" font-weight="800">Sign up</tspan></text>

    <!-- Terms -->
    <text x="175" y="520" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">By proceeding, you agree to InvoCentric's</text>
    <text x="175" y="534" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#475569">Terms of Service <tspan font-weight="500" fill="#94A3B8">and</tspan> Privacy Policy</text>
  </g>

  <!-- Help floating -->
  <g id="HelpPill" transform="translate(260, 780)">
    <rect width="105" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.06))"/>
    <text x="52" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">💬 Need Help?</text>
  </g>
</svg>
