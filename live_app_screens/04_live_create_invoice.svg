<svg width="390" height="980" viewBox="0 0 390 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Screen 04: Live Create Invoice Screen (Exact Code from CreateInvoice.tsx) -->
  <rect width="390" height="980" rx="40" fill="#F8FAFC"/>

  <!-- Top Header Navigation -->
  <g id="TopBar" transform="translate(20, 24)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M20 13 l-5 5 l5 5" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>

    <text x="48" y="24" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#0F172A">Create New Bill</text>

    <!-- AI Scan Bill Button -->
    <rect x="238" y="0" width="112" height="36" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="294" y="23" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#065F46">✨ AI Auto-Fill</text>
  </g>

  <!-- Bill Type Selector Tabs (CreateInvoice.tsx line 57) -->
  <g id="BillTypeTabs" transform="translate(20, 72)">
    <!-- INVOICE (Active) -->
    <rect x="0" y="0" width="86" height="32" rx="8" fill="#059669"/>
    <text x="43" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">INVOICE</text>

    <!-- CASH BILL -->
    <rect x="94" y="0" width="88" height="32" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="138" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">CASH BILL</text>

    <!-- ESTIMATE -->
    <rect x="190" y="0" width="84" height="32" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="232" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">ESTIMATE</text>

    <!-- CHALLAN -->
    <rect x="282" y="0" width="68" height="32" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="316" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569">CHALLAN</text>
  </g>

  <!-- Invoice Meta Row -->
  <g id="MetaRow" transform="translate(20, 116)">
    <rect width="350" height="66" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="14" y="24" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">Invoice Number</text>
    <text x="14" y="46" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#0F172A">INV-2026-1046</text>

    <line x1="175" y1="12" x2="175" y2="54" stroke="#F1F5F9"/>

    <text x="190" y="24" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">Invoice Date</text>
    <text x="190" y="46" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#0F172A">24 Oct 2026 📅</text>
  </g>

  <!-- Customer Selector Card -->
  <g id="CustomerCard" transform="translate(20, 194)">
    <rect width="350" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="16" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#64748B">CUSTOMER DETAILS</text>
    <text x="334" y="24" text-anchor="end" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#059669">+ Add New Customer</text>

    <!-- Selected Customer Pill -->
    <rect x="14" y="36" width="322" height="48" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="36" cy="60" r="12" fill="#059669"/>
    <text x="36" y="64" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF">AT</text>

    <text x="56" y="54" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Aarav Traders</text>
    <text x="56" y="70" font-family="Inter, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">+91 98765 43210 • GSTIN: 27AABCT3518Q1Z1</text>
  </g>

  <!-- Line Items Card Stack -->
  <g id="ItemsSection" transform="translate(20, 304)">
    <text x="0" y="16" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Items List (2 Items)</text>
    <text x="350" y="16" text-anchor="end" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#059669">📷 Scan Barcode</text>

