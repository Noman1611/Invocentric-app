      <text x="16" y="42" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">HSN: 1006 • GST 5%</text>

      <rect x="16" y="52" width="76" height="26" rx="6" fill="#F1F5F9"/>
      <text x="24" y="69" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#64748B">−</text>
      <text x="52" y="69" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#0F172A">2 Pcs</text>
      <text x="80" y="69" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#059669">+</text>

      <text x="105" y="69" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">@ ₹450</text>
      <text x="334" y="69" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#0F172A">₹945.00</text>
    </g>

    <!-- Item Row 2 -->
    <g transform="translate(0, 126)">
      <rect width="350" height="90" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="16" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Tata Tea Gold 500g</text>
      <text x="16" y="42" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">HSN: 0902 • GST 12%</text>

      <rect x="16" y="52" width="76" height="26" rx="6" fill="#F1F5F9"/>
      <text x="24" y="69" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#64748B">−</text>
      <text x="52" y="69" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#0F172A">1 Pcs</text>
      <text x="80" y="69" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#059669">+</text>

      <text x="105" y="69" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">@ ₹310</text>
      <text x="334" y="69" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#0F172A">₹347.20</text>
    </g>

    <!-- Add Item Button -->
    <rect x="0" y="226" width="350" height="42" rx="12" fill="#FFFFFF" stroke="#059669" stroke-dasharray="4 4"/>
    <text x="175" y="252" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#059669">+ Add Item Row</text>
  </g>

  <!-- Tax & Calculation Breakdown -->
  <g id="SummaryBox" transform="translate(20, 590)">
    <rect width="350" height="174" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="16" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">Subtotal</text>
    <text x="334" y="28" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#0F172A">₹1,210.00</text>

    <text x="16" y="52" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">CGST (2.5% + 6%)</text>
    <text x="334" y="52" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#0F172A">₹41.10</text>

    <text x="16" y="76" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748B">SGST (2.5% + 6%)</text>
    <text x="334" y="76" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#0F172A">₹41.10</text>

    <text x="16" y="100" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#059669">Discount</text>
    <text x="334" y="100" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#059669">-₹50.00</text>

    <line x1="16" y1="116" x2="334" y2="116" stroke="#E2E8F0"/>

    <text x="16" y="146" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#0F172A">Grand Total</text>
    <text x="334" y="148" text-anchor="end" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#059669">₹1,242.00</text>
  </g>

  <!-- Sticky Bottom Checkout Bar -->
  <g id="StickyActionBar" transform="translate(0, 880)">
    <rect width="390" height="100" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="20" y="16" width="100" height="48" rx="12" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="70" y="45" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#475569">Save Draft</text>

    <rect x="130" y="16" width="240" height="48" rx="12" fill="#059669"/>
    <text x="250" y="45" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">Save &amp; Print Bill (F12) ➔</text>
  </g>
